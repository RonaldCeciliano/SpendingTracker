{% extends "base.html" %}
{% block title %}Upload too large — Spendly{% endblock %}
{% block content %}
<section class="auth-section expense-page">
    <div class="auth-container expense-container">
        <div class="auth-error" role="alert">The upload is too large. Choose a receipt of 5 MiB or smaller and submit the expense again. No changes were saved.</div>
        <a class="btn-ghost" href="{{ url_for('edit_expense', id=request.view_args.id) if request.endpoint == 'edit_expense' else url_for('add_expense') }}">Return to expense form</a>
    </div>
</section>
{% endblock %}
